# ConfiguraciÃ³n COMÃšN a todos los perfiles - security-service
spring:
  application:
    name: security-service
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}

mail:
  notifications:
    enabled: ${MAIL_NOTIFICATIONS_ENABLED:false}
    from: ${SMTP_FROM:no-reply@logitrack.invalid}
    poll-delay-ms: ${MAIL_POLL_DELAY_MS:5000}

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO

security:
  jwt:
    issuer: ${JWT_ISSUER:logitrack-security}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:3600}
    private-key-path: ${JWT_PRIVATE_KEY_LOCATION}
    public-key-path: ${JWT_PUBLIC_KEY_LOCATION}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8065/eureka/}
  instance:
    prefer-ip-address: true
