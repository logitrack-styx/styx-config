# Configuración COMÚN a todos los perfiles - courier-service
spring:
  application:
    name: courier-service
  datasource:
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:}
    password: ${SPRING_RABBITMQ_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION}

courier:
  assignment:
    messaging-enabled: ${ASSIGNMENT_MESSAGING_ENABLED:false}

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    root: INFO

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://eureka-server:8065/eureka/}
  instance:
    prefer-ip-address: true
